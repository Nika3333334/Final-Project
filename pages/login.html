<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> <!-- განახლებული ფონტ-אוსომი აიქონებისთვის -->
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <link rel="stylesheet" href="../styles/responsive.css">
</head>
<body>
    <img class="imgg1" src="https://t4.ftcdn.net/jpg/03/18/03/17/360_F_318031797_9P08hgmPGwrMQgU1PWZLB1snpj8HPcvO.jpg" alt="Background Car">

<div class="dvv1">
    
    <!-- sign ini -->
    <div class="dvv2">
        <h2 class="hh2">Sign In</h2>
        <p class="pp1">Welcome back in our garage</p>

        <form class="frmm1">
            <label class="lbll1">Email or Username</label>
            <input type="text" class="inpp1" placeholder="Enter email or username" required>

            <label class="lbll1">Password</label>
            <input type="password" class="inpp1" placeholder="Enter password" required>

            
            <div class="forgot-container">
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="bttn1">Sign In</button>
        </form>

        
        <div class="social-login">
            <p class="social-text">or continue with</p>
            <div class="social-btns">
                <button class="s-btn"><i class="fab fa-google"></i> Google</button>
                <button class="s-btn"><i class="fab fa-github"></i> Github</button>
            </div>
        </div>
    </div>

    <!-- sign upi -->
    <div class="dvv3">
        <h2 class="hh2">Sign Up</h2>
        <p class="pp1">Create a new account</p>

        <form class="frmm1">
            <label class="lbll1">Full Name</label>
            <input type="text" class="inpp1" placeholder="Your Name" required>

            <label class="lbll1">Username</label>
            <input type="text" class="inpp1" placeholder="Choose a username" required>

            <label class="lbll1">Email</label>
            <input type="email" class="inpp1" placeholder="example@mail.com" required>

            <label class="lbll1">Birthday</label>
            <input type="date" class="inpp1" required>

            <label class="lbll1">Password</label>
            <input type="password" class="inpp1" placeholder="Create password" required>

            <button type="submit" class="bttn1">Sign Up</button>
        </form>

        
        <div class="social-login">
            <p class="social-text">or sign up with</p>
            <div class="social-btns">
                <button class="s-btn"><i class="fab fa-google"></i> Google</button>
                <button class="s-btn"><i class="fab fa-github"></i> Github</button>
            </div>
        </div>
    </div>

</div>
</body>
</html>
